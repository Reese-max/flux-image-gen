name = "flux-image-gen"
main = "src/index.js"
compatibility_date = "2026-06-24"
compatibility_flags = ["nodejs_compat"]

# Static SPA (index.html + /static/*) is served directly from ./public.
# Non-asset routes (/generate, /health) fall through to the Worker in src/index.js.
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# Public, non-secret config. Secret keys are set separately:
#   npx wrangler secret put NVIDIA_API_KEY
#   npx wrangler secret put GEMINI_API_KEY
NVIDIA_BASE_URL = "https://ai.api.nvidia.com/v1/genai"
# Gemma model served via the Gemini API for the plain-CN to English prompt transform.
GEMINI_PROMPT_MODEL = "gemma-4-31b-it"

# --- Edge rate limiting for /generate (per client IP) ---
# The Worker treats env.GENERATE_RATE_LIMITER as optional: until the binding below
# is enabled, /generate is NOT rate limited. To activate, uncomment the block,
# confirm the binding syntax against the Wrangler docs for your installed version
# (`npx wrangler --version`), then `npm run deploy`. `period` accepts 10 or 60.
# [[unstable_rate_limit]]
# name = "GENERATE_RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 12, period = 60 }

# --- Optional R2-backed cloud gallery ---
# The Worker treats env.IMAGE_BUCKET as optional: /gallery returns 503 until the
# binding below is enabled. To activate: create the bucket, then uncomment.
#   npx wrangler r2 bucket create flux-image-gallery
# [[r2_buckets]]
# binding = "IMAGE_BUCKET"
# bucket_name = "flux-image-gallery"
