name = "flux-image-gen"
main = "src/index.js"
compatibility_date = "2026-06-24"
compatibility_flags = ["nodejs_compat"]
[version_metadata]
binding = "CF_VERSION_METADATA"
[observability]
enabled = true
head_sampling_rate = 0.1
[observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = true
[assets]
directory = "./public"
binding = "ASSETS"
[vars]
# This Worker configuration is the public/live policy. Local tests that construct
# env objects without ENVIRONMENT remain explicitly non-production.
ENVIRONMENT = "production"
NVIDIA_BASE_URL = "https://ai.api.nvidia.com/v1/genai"
GEMINI_PROMPT_MODEL = "gemma-4-31b-it"
GEMINI_COMPLETE_MODEL = "gemma-4-26b-a4b-it"
GEMINI_VISION_MODEL = "gemini-2.5-flash"
VISION_QA_ENABLED = "false"
POLLINATIONS_FALLBACK_ENABLED = "true"
# Fail closed if TURNSTILE_SECRET_KEY is absent; never silently disable the
# public abuse-control layer because of a deployment/configuration mistake.
TURNSTILE_REQUIRED = "true"
TURNSTILE_SITE_KEY = "0x4AAAAAAD2QELaSWsFTNJOV"
USAGE_ESTIMATED_COST_USD_PER_IMAGE = "0.003"
USAGE_ESTIMATED_PROMPT_COST_USD_PER_REQUEST = "0"
USAGE_ALERT_DAILY_GENERATIONS = "1000"
[[ratelimits]]
name = "GENERATE_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 12, period = 60 }
[[r2_buckets]]
binding = "IMAGE_BUCKET"
bucket_name = "flux-image-gallery"
[ai]
binding = "AI"
