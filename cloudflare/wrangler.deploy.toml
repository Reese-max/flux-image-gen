# Temporary deploy config for the WSL wrangler workaround (Node 25 native crash).
# Mirrors wrangler.toml but points main at the pre-built esbuild bundle.
name = "flux-image-gen"
main = "dist/_worker.bundle.js"
compatibility_date = "2026-06-24"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
NVIDIA_BASE_URL = "https://ai.api.nvidia.com/v1/genai"
GEMINI_PROMPT_MODEL = "gemma-4-31b-it"
GEMINI_COMPLETE_MODEL = "gemma-4-26b-a4b-it"

[[ratelimits]]
name = "GENERATE_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

[[r2_buckets]]
binding = "IMAGE_BUCKET"
bucket_name = "flux-image-gallery"

[ai]
binding = "AI"
