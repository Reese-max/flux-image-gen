name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Cloudflare dependencies
        run: npm ci --prefix cloudflare

      - name: Install Playwright Chromium
        run: npm --prefix cloudflare run qa:browser:install

      # verify.mjs includes Python tests, frontend tests, browser QA,
      # Cloudflare sync:check, syntax checks, and Worker tests.
      - name: Run full offline verify
        run: node scripts/verify.mjs
