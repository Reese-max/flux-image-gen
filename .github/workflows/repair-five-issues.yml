name: Repair five reported UI issues

on:
  push:
    branches:
      - feature/fix-five-ui-regressions
    paths:
      - .github/workflows/repair-five-issues.yml
      - .github/repair_five_issues.py
      - .github/patch_test_fixture.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: feature/fix-five-ui-regressions

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Apply fixes in issue order
        run: |
          python .github/repair_five_issues.py
          python .github/patch_test_fixture.py

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Cloudflare dependencies
        run: npm ci --prefix cloudflare

      - name: Sync canonical static files
        run: npm --prefix cloudflare run sync

      - name: Run focused Python regressions
        run: python -m pytest -q tests/test_static_ui.py tests/test_five_issue_regressions.py

      - name: Run frontend download regression tests
        run: node --test tests/frontend/download-utils.test.cjs

      - name: Check frontend syntax and static sync
        run: |
          npm --prefix cloudflare run check
          npm --prefix cloudflare run sync:check

      - name: Commit repaired source and generated deploy copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes were produced"; exit 1; }
          git commit -m "fix(ui): resolve five reported regressions"
          git push origin HEAD:feature/fix-five-ui-regressions
