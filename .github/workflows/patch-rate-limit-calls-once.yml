name: Patch limiter call sites once
on:
  pull_request:
    paths: ['.github/workflows/patch-rate-limit-calls-once.yml']
permissions:
  contents: read
jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/issue-11-fail-closed-abuse-controls-20260906'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Patch exact limiter calls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/src/index.js')
          s=p.read_text()
          old='checkRateLimit(request, env.GENERATE_RATE_LIMITER)'
          n=s.count(old)
          assert n == 7, n
          p.write_text(s.replace(old, 'checkRateLimit(request, env.GENERATE_RATE_LIMITER, env)'))
          PY
          git diff --exit-code -- . ':!cloudflare/src/index.js' || true
      - name: Commit only the intended source file
        run: |
          git add -- cloudflare/src/index.js
          test "$(git diff --cached --name-only)" = "cloudflare/src/index.js"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(abuse): pass environment policy to limiter guard'
          git push origin HEAD:refs/heads/feature/issue-11-fail-closed-abuse-controls-20260906
