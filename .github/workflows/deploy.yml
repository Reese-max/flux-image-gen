name: Deploy

on:
  push:
    branches: [production]
  pull_request:
    branches: [main, production]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run sync:check

  deploy-preview:
    needs: check
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: cd cloudflare && npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify public abuse controls before preview upload
        run: python scripts/check_deployment_preflight.py --public
      - name: Refresh Cloudflare Token
        id: cf_token
        env:
          CF_REFRESH_TOKEN: ${{ secrets.CF_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CF_REFRESH_TOKEN:-}" ]]; then
            echo "::error::Cloudflare refresh credential is unavailable."
            exit 1
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          if ! status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --connect-timeout 15 --max-time 30 \
            --request POST "https://dash.cloudflare.com/oauth2/token" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "refresh_token=$CF_REFRESH_TOKEN" \
            --data-urlencode "client_id=54d11594-84e4-41aa-b438-e81b8fa78ee7")"; then
            echo "::error::Cloudflare token refresh request failed before returning an HTTP response."
            exit 1
          fi
          TOKEN="$(node scripts/parse_cloudflare_access_token.mjs "$response_file" "$status")"
          echo "::add-mask::$TOKEN"
          printf 'token=%s\n' "$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy Preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf_token.outputs.token }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload
          workingDirectory: cloudflare

  deploy-production:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: cd cloudflare && npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify public production abuse controls and bindings
        run: python scripts/check_deployment_preflight.py --public
      - name: Refresh Cloudflare Token
        id: cf_token
        env:
          CF_REFRESH_TOKEN: ${{ secrets.CF_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CF_REFRESH_TOKEN:-}" ]]; then
            echo "::error::Cloudflare refresh credential is unavailable."
            exit 1
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          if ! status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --connect-timeout 15 --max-time 30 \
            --request POST "https://dash.cloudflare.com/oauth2/token" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "refresh_token=$CF_REFRESH_TOKEN" \
            --data-urlencode "client_id=54d11594-84e4-41aa-b438-e81b8fa78ee7")"; then
            echo "::error::Cloudflare token refresh request failed before returning an HTTP response."
            exit 1
          fi
          TOKEN="$(node scripts/parse_cloudflare_access_token.mjs "$response_file" "$status")"
          echo "::add-mask::$TOKEN"
          printf 'token=%s\n' "$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Verify production deployment readiness
        working-directory: cloudflare
        run: node scripts/check-deploy-readiness.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cf_token.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf_token.outputs.token }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: cloudflare


