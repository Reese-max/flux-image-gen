name: Deploy

on:
  push:
    branches: [production]
  pull_request:
    branches: [main, production]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit || true

  deploy-preview:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: cd cloudflare && npm ci
      - name: Refresh Cloudflare Token
        id: cf_token
        run: |
          if ! RESP=$(curl --fail --silent --show-error -X POST "https://dash.cloudflare.com/oauth2/token" \
            -d "grant_type=refresh_token&refresh_token=${{ secrets.CF_REFRESH_TOKEN }}&client_id=54d11594-84e4-41aa-b438-e81b8fa78ee7"); then
            echo "::error::Cloudflare token refresh request failed."
            exit 1
          fi
          if ! TOKEN=$(printf '%s' "$RESP" | jq -ser '
            select(length == 1) | .[0]
            | select(type == "object" and (has("error") | not))
            | .access_token
            | select(type == "string" and length > 0)
            | select(test("^[A-Za-z0-9._~+/-]+=*$"))
            | select(test("[[:space:]]") | not)
          ' 2>/dev/null); then
            echo "::error::Cloudflare token refresh returned no valid bearer token."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy Preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf_token.outputs.token }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload
          workingDirectory: cloudflare

  deploy-production:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: cd cloudflare && npm ci
      - name: Refresh Cloudflare Token
        id: cf_token
        run: |
          if ! RESP=$(curl --fail --silent --show-error -X POST "https://dash.cloudflare.com/oauth2/token" \
            -d "grant_type=refresh_token&refresh_token=${{ secrets.CF_REFRESH_TOKEN }}&client_id=54d11594-84e4-41aa-b438-e81b8fa78ee7"); then
            echo "::error::Cloudflare token refresh request failed."
            exit 1
          fi
          if ! TOKEN=$(printf '%s' "$RESP" | jq -ser '
            select(length == 1) | .[0]
            | select(type == "object" and (has("error") | not))
            | .access_token
            | select(type == "string" and length > 0)
            | select(test("^[A-Za-z0-9._~+/-]+=*$"))
            | select(test("[[:space:]]") | not)
          ' 2>/dev/null); then
            echo "::error::Cloudflare token refresh returned no valid bearer token."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy Production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf_token.outputs.token }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: cloudflare

